[package]
name = "btk"
autobenches = false
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "referee"
path = "src/main.rs"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bin]]
name = "study"
path = "src/bin/study/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
divan = "0.1"

[[bench]]
name = "mapgen"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "duel"
harness = false
